<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- Substituí a CDN quebrada por uma funcional (jsDelivr) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"
    type="application/javascript">
  </script>
</head>
<body>
  <h1>Ethers.js - Metamask como provedor</h1>
  <button id="conn">Connet wallet</button>
  <p><strong>address: </strong> <span id="address">empty</span></p> 
  <p><strong>balance: </strong> <span id="balance">0</span></p>

  <script>
    console.log("Metamask: ", window.ethereum);
    console.log("Ethers: ", ethers.ethers);

    const provider = new ethers.ethers.providers.Web3Provider(window.ethereum);

    console.log(provider);

    const connBtn = document.querySelector("#conn");
    const balanceField = document.querySelector("#balance");
    const addressField = document.querySelector("#address");

    connBtn.addEventListener("click", async ()=> {
      console.log("connBtn");

      await provider.send("eth_requestAccounts", []);

      const network = await provider.getNetwork();
      console.log("network: ", network);

      const signer = await provider.getSigner();
      const balance = await signer.getBalance();
      const address = await signer.getAddress();

      console.log("signer: ", signer);
      console.log("balance: ", ethers.utils.formatEther(balance));
      console.log("address: ", address);
      
      const isConnected = signer !== undefined
      
      if (isConnected){
        connBtn.textContent = "connected";
        balanceField.textContent = ethers.utils.formatEther(balance);
        addressField.textContent = address;
      }

    });
  </script>
</body>
</html>
